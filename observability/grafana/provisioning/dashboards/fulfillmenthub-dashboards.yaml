# Grafana dashboard provider for the FulfillmentHub dashboards (mounted into grafana/otel-lgtm by docker-compose.yml).
apiVersion: 1

providers:
  - name: "FulfillmentHub"
    folder: "FulfillmentHub"
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /otel-lgtm/fulfillmenthub-dashboards
      foldersFromFilesStructure: false
