# Local dependencies for FulfillmentHub. Application hosts run with `dotnet run` (profile "deps")
# until Phase 13 adds their images. Values come from .env (see .env.example) — never commit .env.
name: fulfillmenthub

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["deps"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulfillmenthub}
      POSTGRES_USER: ${POSTGRES_USER:-fh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fh} -d ${POSTGRES_DB:-fulfillmenthub}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SQS emulation for local development and tests (ADR-005). Credentials are LocalStack's well-known placeholders.
  localstack:
    image: localstack/localstack:4
    profiles: ["deps"]
    environment:
      SERVICES: sqs
      DEBUG: "0"
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"sqs\": \"(available|running)\"'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Standalone OpenTelemetry UI (traces, logs, metrics) for local development only.
  # This is NOT .NET Aspire orchestration; hosts export OTLP to it via OTEL_EXPORTER_OTLP_ENDPOINT.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    profiles: ["deps"]
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "${OTLP_GRPC_PORT:-4317}:18889"

volumes:
  postgres-data:
