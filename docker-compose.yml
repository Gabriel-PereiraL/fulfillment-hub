# Local dependencies for FulfillmentHub (profile "deps": postgres, localstack, otel-lgtm). Application hosts run
# with `dotnet run` until Phase 13 adds their images. Values come from .env (see .env.example) — never commit .env.
name: fulfillmenthub



# ---------------------------------------------------------------------------------------------------------------------
# Profile "app" (Phase 13): the whole system in containers — `docker compose --profile deps --profile app up --build -d`.
# Images come from docker/Dockerfile.* (multi-stage, non-root, Alpine). The hosts run with the Development environment
# so the seed and the OpenAPI UI are available; secrets come from .env (JWT_SIGNING_KEY is required, the provider keys
# default to the simulator's public dev-only values). `migrate` is the explicit one-off migration task (no automatic
# Migrate() at startup); `seed` writes the fictional development data once the schema exists. docs/DEPLOYMENT.md §3.
# ---------------------------------------------------------------------------------------------------------------------

x-app-environment: &app-environment
  Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-fulfillmenthub};Username=${POSTGRES_USER:-fh};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
  Jwt__SigningKey: "${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env (at least 32 characters)}"
  Providers__Payment__BaseUrl: "http://simulator:8080"
  Providers__Payment__ApiKey: "${PAYMENT_API_KEY:-dev-only-payment-api-key}"
  Providers__Payment__WebhookSigningKey: "${PAYMENT_WEBHOOK_SIGNING_KEY:-dev-only-payment-webhook-signing-key}"
  Providers__Delivery__BaseUrl: "http://simulator:8080"
  Providers__Delivery__ClientId: "${DELIVERY_CLIENT_ID:-dev-only-delivery-client-id}"
  Providers__Delivery__ClientSecret: "${DELIVERY_CLIENT_SECRET:-dev-only-delivery-client-secret}"
  Providers__Delivery__WebhookSigningKey: "${DELIVERY_WEBHOOK_SIGNING_KEY:-dev-only-delivery-webhook-signing-key}"
  Messaging__Sqs__Enabled: "true"
  Messaging__Sqs__ServiceUrl: "http://localstack:4566"
  Messaging__Sqs__AccessKey: "test"
  Messaging__Sqs__SecretKey: "test"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-lgtm:4317"
  OTEL_METRIC_EXPORT_INTERVAL: "10000"

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["deps"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulfillmenthub}
      POSTGRES_USER: ${POSTGRES_USER:-fh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fh} -d ${POSTGRES_DB:-fulfillmenthub}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SQS emulation for local development and tests (ADR-005). Credentials are LocalStack's well-known placeholders.
  localstack:
    image: localstack/localstack:4
    profiles: ["deps"]
    environment:
      SERVICES: sqs
      DEBUG: "0"
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"sqs\": \"(available|running)\"'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local observability backend (D-78, ADR-009 addendum): OTel Collector + Prometheus + Tempo + Loki + Grafana in one
  # container. Hosts export OTLP to it (OTEL_EXPORTER_OTLP_ENDPOINT, gRPC 4317). Grafana at http://localhost:3000
  # (anonymous admin, local only). Datasources come with the image; the FulfillmentHub dashboard and the alert rules
  # are provisioned from ./observability (docs/OBSERVABILITY.md §6, §8).
  otel-lgtm:
    image: grafana/otel-lgtm:0.33.1
    profiles: ["deps"]
    environment:
      ENABLE_LOGS_ALL: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/grafana/provisioning/alerting/fulfillmenthub-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/fulfillmenthub-alerts.yaml:ro
      - ./observability/grafana/provisioning/dashboards/fulfillmenthub-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/fulfillmenthub-dashboards.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/fulfillmenthub-dashboards:ro
      - lgtm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Optional lightweight alternative (profile "aspire"): the standalone .NET Aspire Dashboard UI (no persistence, no
  # alerting). Point OTEL_EXPORTER_OTLP_ENDPOINT at http://localhost:4327 (ASPIRE_OTLP_PORT) to use it instead.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    profiles: ["aspire"]
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "${ASPIRE_OTLP_PORT:-4327}:18889"

  migrate:
    image: fulfillmenthub/api:local
    build: { context: ., dockerfile: docker/Dockerfile.api }
    profiles: ["app"]
    command: ["migrate"]
    environment:
      <<: *app-environment
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  seed:
    image: fulfillmenthub/api:local
    profiles: ["app"]
    command: ["seed"]
    environment:
      <<: *app-environment
      ASPNETCORE_ENVIRONMENT: Development
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env (12+ characters)}"
      Seed__OperatorPassword: "${SEED_OPERATOR_PASSWORD:?set SEED_OPERATOR_PASSWORD in .env (12+ characters)}"
      Seed__CustomerPassword: "${SEED_CUSTOMER_PASSWORD:?set SEED_CUSTOMER_PASSWORD in .env (12+ characters)}"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  simulator:
    image: fulfillmenthub/simulator:local
    build: { context: ., dockerfile: docker/Dockerfile.simulator }
    profiles: ["app"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Simulator__Payments__WebhookUrl: "http://api:8080/api/v1/webhooks/payments"
      Simulator__Delivery__WebhookUrl: "http://api:8080/api/v1/webhooks/deliveries"
      Simulator__Payments__ApiKey: "${PAYMENT_API_KEY:-dev-only-payment-api-key}"
      Simulator__Payments__WebhookSigningKey: "${PAYMENT_WEBHOOK_SIGNING_KEY:-dev-only-payment-webhook-signing-key}"
      Simulator__Delivery__ClientId: "${DELIVERY_CLIENT_ID:-dev-only-delivery-client-id}"
      Simulator__Delivery__ClientSecret: "${DELIVERY_CLIENT_SECRET:-dev-only-delivery-client-secret}"
      Simulator__Delivery__WebhookSigningKey: "${DELIVERY_WEBHOOK_SIGNING_KEY:-dev-only-delivery-webhook-signing-key}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-lgtm:4317"
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    ports:
      - "${SIMULATOR_PORT:-5100}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  api:
    image: fulfillmenthub/api:local
    profiles: ["app"]
    environment:
      <<: *app-environment
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
      simulator: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    image: fulfillmenthub/worker:local
    build: { context: ., dockerfile: docker/Dockerfile.worker }
    profiles: ["app"]
    environment:
      <<: *app-environment
      DOTNET_ENVIRONMENT: Development
    depends_on:
      migrate: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
      simulator: { condition: service_healthy }
    # No HTTP surface: liveness is the fh.worker.heartbeats metric and the WorkerHeartbeatMissing alert (D-86).

volumes:
  postgres-data:
  lgtm-data:
